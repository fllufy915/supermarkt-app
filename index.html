<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Smart Shopping</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .deal-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .deal-card:active { transform: scale(0.98); }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass border-b border-slate-800/50">
        <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center shadow-lg shadow-primary-500/20">
                    <i class="fas fa-shopping-basket text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-primary-400 to-primary-500 bg-clip-text text-transparent">Smart Shopping</h1>
                    <p class="text-xs text-slate-400" id="header-status">Lade...</p>
                </div>
            </div>
            <button onclick="toggleSearch()" class="w-10 h-10 rounded-xl bg-slate-800/80 flex items-center justify-center active:scale-95 transition-transform">
                <i class="fas fa-search text-slate-300"></i>
            </button>
        </div>
    </header>

    <!-- Search Bar -->
    <div id="search-bar" class="fixed top-[72px] left-0 right-0 z-40 glass border-b border-slate-800/50 transform -translate-y-full transition-transform duration-300">
        <div class="max-w-lg mx-auto px-4 py-3">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="Produkte suchen..." 
                    class="w-full pl-11 pr-4 py-3 bg-slate-800/80 rounded-xl border border-slate-700/50 text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500/50 transition-all placeholder-slate-500 text-white"
                    oninput="filterProducts(this.value)">
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="pt-20 pb-24 px-4 max-w-lg mx-auto">
        
        <!-- Stats -->
        <section class="mb-6">
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gradient-to-br from-primary-500/20 to-primary-600/10 rounded-2xl p-4 border border-primary-500/20">
                    <div class="text-2xl font-bold text-primary-400" id="stat-deals">0</div>
                    <div class="text-xs text-slate-400 mt-1">Angebote</div>
                </div>
                <div class="bg-gradient-to-br from-blue-500/20 to-blue-600/10 rounded-2xl p-4 border border-blue-500/20">
                    <div class="text-2xl font-bold text-blue-400" id="stat-savings">0%</div>
                    <div class="text-xs text-slate-400 mt-1">Max. Ersparnis</div>
                </div>
                <div class="bg-gradient-to-br from-purple-500/20 to-purple-600/10 rounded-2xl p-4 border border-purple-500/20">
                    <div class="text-2xl font-bold text-purple-400" id="stat-stores">0</div>
                    <div class="text-xs text-slate-400 mt-1">Läden</div>
                </div>
            </div>
        </section>

        <!-- Store Filter -->
        <section class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-300">Supermärkte</h2>
                <button onclick="clearFilters()" class="text-xs text-primary-400 hover:text-primary-300 transition-colors">Zurücksetzen</button>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2" id="store-filters">
                <!-- Stores injected by JS -->
            </div>
        </section>

        <!-- Shopping List -->
        <section class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-300">
                    <i class="fas fa-shopping-list mr-2 text-primary-400"></i>Meine Liste
                </h2>
                <button onclick="showAddItem()" class="w-8 h-8 rounded-lg bg-primary-500/20 flex items-center justify-center text-primary-400 hover:bg-primary-500/30 transition-colors">
                    <i class="fas fa-plus text-sm"></i>
                </button>
            </div>
            <div id="shopping-list" class="space-y-2">
                <!-- Items injected by JS -->
            </div>
        </section>

        <!-- Best Deals -->
        <section>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-slate-300">
                    <i class="fas fa-fire mr-2 text-orange-400"></i>Beste Deals
                </h2>
                <select id="sort-select" onchange="sortDeals(this.value)" class="bg-slate-800/80 border border-slate-700/50 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-primary-500 text-slate-300">
                    <option value="discount">Beste Deals</option>
                    <option value="price-asc">Preis ↓</option>
                    <option value="price-desc">Preis ↑</option>
                </select>
            </div>
            <div id="deals-list" class="space-y-3">
                <!-- Loading skeleton -->
                <div class="shimmer rounded-2xl h-28"></div>
                <div class="shimmer rounded-2xl h-28"></div>
                <div class="shimmer rounded-2xl h-28"></div>
            </div>
        </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 glass border-t border-slate-800/50">
        <div class="max-w-lg mx-auto flex justify-around py-2">
            <button onclick="showTab('deals')" class="flex flex-col items-center gap-1 px-6 py-2 rounded-xl text-primary-400" id="nav-deals">
                <i class="fas fa-fire text-xl"></i>
                <span class="text-[10px] font-medium">Deals</span>
            </button>
            <button onclick="showTab('list')" class="flex flex-col items-center gap-1 px-6 py-2 rounded-xl text-slate-500 hover:text-slate-300 transition-colors relative" id="nav-list">
                <i class="fas fa-shopping-list text-xl"></i>
                <span class="text-[10px] font-medium">Liste</span>
                <span id="list-badge" class="absolute -top-1 right-2 w-5 h-5 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center hidden">0</span>
            </button>
            <button onclick="showTab('scan')" class="flex flex-col items-center gap-1 px-6 py-2 rounded-xl text-slate-500 hover:text-slate-300 transition-colors" id="nav-scan">
                <i class="fas fa-camera text-xl"></i>
                <span class="text-[10px] font-medium">Scan</span>
            </button>
        </div>
    </nav>

    <!-- Add Item Modal -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAddModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-slate-900 rounded-t-3xl border-t border-slate-800 p-6 transform translate-y-full transition-transform duration-300" id="add-modal-content">
            <h3 class="text-lg font-bold mb-4">Zur Liste hinzufügen</h3>
            <input type="text" id="new-item-name" placeholder="Produktname..." 
                class="w-full px-4 py-3 bg-slate-800/80 rounded-xl border border-slate-700/50 text-sm focus:outline-none focus:border-primary-500 mb-3 text-white placeholder-slate-500">
            <div class="flex gap-2 mb-4">
                <button onclick="addItem('high')" class="flex-1 py-3 bg-red-500/20 text-red-400 rounded-xl text-sm font-medium hover:bg-red-500/30 transition-colors">
                    <i class="fas fa-fire mr-1"></i> Wichtig
                </button>
                <button onclick="addItem('normal')" class="flex-1 py-3 bg-slate-700/50 text-slate-300 rounded-xl text-sm font-medium hover:bg-slate-700 transition-colors">
                    Normal
                </button>
            </div>
            <button onclick="closeAddModal()" class="w-full py-3 bg-slate-800 text-slate-400 rounded-xl text-sm hover:bg-slate-700 transition-colors">Abbrechen</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
